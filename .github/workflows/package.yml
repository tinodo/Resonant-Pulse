name: GitHub Package

# Publishes the ResonantPulse.Core NuGet package (the engine of the application) to GitHub Packages for a version that already has a
# published GitHub release. release.yml calls this workflow after it has published a release. It can also be run by hand from main:
# for a release that was published before this workflow existed (1.0.0), or to repeat a push that failed. A version that is already on
# GitHub Packages is skipped, never overwritten.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version of an existing GitHub release, SemVer without v (for example 1.0.0)"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: package-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  pack:
    name: Pack and verify ResonantPulse.Core
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check that this version may be published
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REF" == "refs/heads/main" ]] || { echo "::error::The package must be published from main."; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::Invalid semantic version."; exit 1; }
          # A package exists only for a release that has been published, and the release's own pre-release flag must agree with the version.
          release=$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION") || { echo "::error::There is no published GitHub release v$VERSION."; exit 1; }
          [[ "$(jq -r '.draft' <<<"$release")" == "false" ]] || { echo "::error::Release v$VERSION is a draft."; exit 1; }
          expected_prerelease=false
          [[ "$VERSION" == *-* ]] && expected_prerelease=true
          [[ "$(jq -r '.prerelease' <<<"$release")" == "$expected_prerelease" ]] || { echo "::error::Release v$VERSION and version $VERSION disagree about being a pre-release."; exit 1; }
          # The library in the package is the library of the release: the commit being built comes from the tagged one, and what the library
          # is compiled from is the same (packaging/Assert-ReleaseCode.ps1: only the package metadata and the version may differ), so a package
          # can be published later for a release that has no packaging of its own (1.0.0).
          tag_commit=$(git rev-parse "v$VERSION^{commit}")
          git merge-base --is-ancestor "$tag_commit" HEAD || { echo "::error::The tag v$VERSION is not an ancestor of the commit being built."; exit 1; }
          pwsh -NoProfile -File ./packaging/Assert-ReleaseCode.ps1 -Release "$tag_commit" -Candidate HEAD || {
            echo "::error::The library or its build settings differ from those of release v$VERSION. Publish the package of a version from a commit with the released library."
            exit 1
          }
          echo "Release v$VERSION is published at $tag_commit; the library at $SOURCE_SHA is the same." >> "$GITHUB_STEP_SUMMARY"
          # The exact commit must have passed the full build and the security analysis on main, as a release requires.
          for workflow in ci.yml codeql.yml; do
            run_id=$(gh run list --workflow "$workflow" --commit "$SOURCE_SHA" --event push --json databaseId --jq '.[0].databaseId // empty')
            [[ -n "$run_id" ]] || { echo "::error::No main-branch run of $workflow exists for this exact commit."; exit 1; }
            gh run watch "$run_id" --exit-status --interval 15
          done
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Test the engine
        run: dotnet test tests/ResonantPulse.Core.Tests/ResonantPulse.Core.Tests.csproj --configuration Release
      - name: Pack the package and check it as a user of it would
        env:
          VERSION: ${{ inputs.version }}
        shell: pwsh
        run: ./packaging/Build-NuGetPackage.ps1 -Version $env:VERSION
      - name: Record the package
        shell: pwsh
        run: |
          $package = Get-ChildItem artifacts/nuget -Filter '*.nupkg' -File
          if (@($package).Count -ne 1) { throw "Expected one package but found $(@($package).Count)." }
          $hash = (Get-FileHash -LiteralPath $package.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          @('### ResonantPulse.Core', '', "- Package: $($package.Name) ($($package.Length) bytes)", "- SHA-256: $hash", "- Built from: $env:GITHUB_SHA") |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nuget-package
          path: artifacts/nuget/*.nupkg
          if-no-files-found: error

  publish:
    name: Push to GitHub Packages
    # A separate job: the write token lives where no repository code runs, and a failed push can be re-run on its own.
    needs: pack
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: nuget-package
          path: package
      - name: Push to GitHub Packages
        env:
          OWNER: ${{ github.repository_owner }}
          TOKEN: ${{ github.token }}
        run: |
          $packages = @(Get-ChildItem -LiteralPath package -Filter '*.nupkg' -File)
          if ($packages.Count -ne 1) { throw "Expected one package but found $($packages.Count)." }
          dotnet nuget add source "https://nuget.pkg.github.com/$env:OWNER/index.json" --name github --username $env:OWNER --password $env:TOKEN --store-password-in-clear-text
          if ($LASTEXITCODE -ne 0) { throw 'Adding the GitHub Packages source failed.' }
          dotnet nuget push $packages[0].FullName --source github --api-key $env:TOKEN --skip-duplicate
          if ($LASTEXITCODE -ne 0) { throw 'Pushing the package failed.' }
          "PACKAGE_FILE=$($packages[0].Name)" >> $env:GITHUB_ENV
      - name: Check that the version is listed and who can see it
        # Not a gate: the push itself has succeeded by now, and the list can lag. It says what is true and what is left for a person to do.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          $version = $env:PACKAGE_FILE -replace '^ResonantPulse\.Core\.(.+)\.nupkg$', '$1'
          $package = $null
          $packageName = $null
          foreach ($name in 'ResonantPulse.Core', 'resonantpulse.core') {
            $json = gh api "users/$env:OWNER/packages/nuget/$name" 2>$null
            if ($LASTEXITCODE -eq 0 -and $json) { $package = $json | ConvertFrom-Json; $packageName = $name; break }
          }
          $lines = @('### ResonantPulse.Core on GitHub Packages', '')
          $visibilityKnown = $false
          $public = $false
          if ($package) {
            $listed = $false
            for ($attempt = 1; $attempt -le 3 -and -not $listed; $attempt++) {
              $names = @(gh api "users/$env:OWNER/packages/nuget/$packageName/versions" --paginate --jq '.[].name' 2>$null)
              if ($LASTEXITCODE -eq 0 -and $names -contains $version) { $listed = $true }
              elseif ($attempt -lt 3) { Start-Sleep -Seconds 10 }
            }
            $lines += "- Version ${version}: $(if ($listed) { 'listed' } else { 'not listed yet' })"
            $lines += "- Visibility: $($package.visibility)"
            $lines += "- Package: $($package.html_url)"
            if (-not $listed) { Write-Host "::warning title=Version not listed yet::$version was pushed but is not in the package's version list yet. Re-run this job to check again." }
            $visibilityKnown = $true
            $public = $package.visibility -eq 'public'
          }
          else {
            # A failed lookup (an outage, a delay, a package this token cannot read) does not say that the package is private.
            $lines += "- Version $version was pushed."
            $lines += '- Whether it is listed, and who can see the package, could not be read with the workflow token just now. The push itself succeeded.'
            Write-Host '::warning title=Package visibility unknown::The package was pushed, but its listing and visibility could not be read. Open the package page to see who can see it, and re-run this job to check again.'
          }
          if ($visibilityKnown -and -not $public) {
            $lines += '- To list it on the repository page: open the package, then Package settings, Danger Zone, Change visibility, Public. GitHub has no API for this and it cannot be undone.'
            Write-Host '::notice title=Make ResonantPulse.Core public::GitHub publishes the first version of a package as private and has no API to change that. To list it on the repository page: open the package, then Package settings, Danger Zone, Change visibility, Public. This cannot be undone.'
          }
          elseif (-not $visibilityKnown) {
            $lines += '- If the package is private: open it, then Package settings, Danger Zone, Change visibility, Public (GitHub publishes the first version of a package as private, has no API to change that, and the change cannot be undone).'
          }
          $lines | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          exit 0
