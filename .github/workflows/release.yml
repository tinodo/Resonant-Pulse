name: GitHub release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer without v (use a prerelease until hardware acceptance is complete)"
        required: true
        default: "0.1.0-preview.1"
      prerelease:
        description: "Mark as a preview, not production-ready"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release request
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
          PREVIEW: ${{ inputs.prerelease }}
        shell: bash
        run: |
          [[ "$REF" == "refs/heads/main" ]] || { echo "::error::Release must run from main."; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::Invalid semantic version."; exit 1; }
          if [[ "$PREVIEW" != "true" && "$VERSION" == *-* ]]; then
            echo "::error::A prerelease version cannot be labelled stable."; exit 1
          fi
  verified-build:
    needs: validate
    uses: ./.github/workflows/ci.yml
  release:
    needs: verified-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-*
          merge-multiple: true
          path: release-assets
      - name: Publish verified downloads
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PREVIEW: ${{ inputs.prerelease }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--repo "$GITHUB_REPOSITORY" --target "$SOURCE_SHA" --title "Resonant Pulse $VERSION" --notes-file docs/RELEASE-NOTES.md)
          if [[ "$PREVIEW" == "true" ]]; then args+=(--prerelease); fi
          gh release create "v$VERSION" release-assets/*.zip release-assets/*.sha256 "${args[@]}"
