name: GitHub release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "SemVer without v (use a prerelease until hardware acceptance is complete)"
        required: true
        default: "0.1.0-preview.1"
      prerelease:
        description: "Mark as a preview, not production-ready"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: github-release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Validate release request
        env:
          VERSION: ${{ inputs.version }}
          REF: ${{ github.ref }}
          PREVIEW: ${{ inputs.prerelease }}
          ACCEPTED: ${{ vars.PRODUCT_ACCEPTANCE_COMPLETED }}
        shell: bash
        run: |
          [[ "$REF" == "refs/heads/main" ]] || { echo "::error::Release must run from main."; exit 1; }
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::Invalid semantic version."; exit 1; }
          if [[ "$PREVIEW" != "true" && "$VERSION" == *-* ]]; then
            echo "::error::A prerelease version cannot be labelled stable."; exit 1
          fi
          if [[ "$PREVIEW" != "true" && "$ACCEPTED" != "true" ]]; then
            echo "::error::Stable delivery requires recorded full-product/device acceptance and PRODUCT_ACCEPTANCE_COMPLETED=true."; exit 1
          fi
  verified-build:
    needs: validate
    uses: ./.github/workflows/ci.yml
    with:
      version: ${{ inputs.version }}
  release:
    needs: verified-build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: windows-*
          merge-multiple: true
          path: release-assets
      - name: Require successful security analysis of the exact source commit
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow codeql.yml --commit "$SOURCE_SHA" --event push --json databaseId --jq '.[0].databaseId // empty')
          [[ -n "$run_id" ]] || { echo "::error::No main-branch CodeQL run exists for this exact commit."; exit 1; }
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status --interval 15
      - name: Publish verified downloads
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PREVIEW: ${{ inputs.prerelease }}
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          # Creating a ref is atomic: an existing tag must never relabel tested binaries.
          gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" \
            -f "ref=refs/tags/v$VERSION" -f "sha=$SOURCE_SHA" >/dev/null
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag --title "Resonant Pulse $VERSION" --notes-file docs/RELEASE-NOTES.md)
          if [[ "$PREVIEW" == "true" ]]; then args+=(--prerelease); fi
          gh release create "v$VERSION" release-assets/*.zip release-assets/*.sha256 "${args[@]}"
