<circle cx="1350" cy="788" r="5" fill="#fff"/><path d="m1350 788-53 83" stroke="#fff" stroke-width="4"/><rect x="1287" y="862" width="20" height="20" fill="#ffff00"/>
<text x="1350" y="914" text-anchor="middle" font-size="14" style="fill:#fff">Static marker option / no trail</text>
<rect x="848" y="948" width="146" height="55" rx="5" fill="#ffff00"/><text x="921" y="982" text-anchor="middle" font-size="22" style="fill:#000">Pause</text>
<rect x="1008" y="948" width="146" height="55" rx="5" fill="#000" stroke="#fff" stroke-width="2"/><text x="1081" y="982" text-anchor="middle" font-size="22" style="fill:#fff">Stop</text>
<rect x="1168" y="948" width="146" height="55" rx="5" fill="#000" stroke="#fff" stroke-width="2"/><text x="1241" y="982" text-anchor="middle" font-size="22" style="fill:#fff">Mute</text>
<rect x="1328" y="948" width="174" height="55" rx="5" fill="#000" stroke="#fff" stroke-width="2"/><text x="1415" y="982" text-anchor="middle" font-size="22" style="fill:#fff">More</text>
<text x="848" y="1042" font-size="16" style="fill:#fff">Shapes + words / no color-only states / no glow</text>
<text x="70" y="1121" font-size="25">Stage clarity is part of the visual identity.</text><text x="70" y="1155" font-size="14" class="muted">Layout studies only: final compact DIPs, 200% text fit, translations and Narrator behavior require real WinUI validation.</text>
