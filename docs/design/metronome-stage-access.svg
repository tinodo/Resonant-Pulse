<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" style="width:100%;height:auto;max-width:1600px;display:block" role="img" aria-labelledby="title desc">
<title id="title">Resonant Pulse - Stage and accessible compact concept</title>
<desc id="desc">A stage-oriented metronome shows a large dotted-quarter tempo of 80 BPM in 6/8, two main pulses, the next song queued and persistent Pause, Stop and Mute buttons. Beneath are a German large-text compact layout and an opaque high-contrast reduced-motion layout with a simple pendulum geometry. These are static concept studies, not validated localized app screens.</desc>
<defs><style>text{font-family:'Segoe UI',Arial,sans-serif;fill:#f0f5f3}.muted{fill:#a6b5b8}.cyan{fill:#58e4f4}.pink{fill:#ee83d3}.gold{fill:#f3e687}.label{font-size:12px;letter-spacing:1.4px}.number{font-family:Bahnschrift,'Segoe UI',sans-serif;font-variant-numeric:tabular-nums}</style>
<radialGradient id="ambient"><stop stop-color="#58e4f4" stop-opacity=".09"/><stop offset="1" stop-color="#58e4f4" stop-opacity="0"/></radialGradient></defs>
<rect width="1600" height="1180" fill="#070b10"/>
<text x="70" y="52" font-size="15" class="cyan" letter-spacing="4">RESONANT PULSE</text><text x="1530" y="52" text-anchor="end" font-size="14" class="muted">04 / STAGE + ACCESS - STATIC DESIGN CONCEPT</text>
<rect x="70" y="80" width="1460" height="548" rx="18" fill="#0c1116" stroke="#71858f"/>
<path d="M70 134H1530" stroke="#33444c"/><text x="104" y="114" font-size="18" font-weight="600">Resonant Pulse / Stage</text>
<rect x="1113" y="92" width="230" height="30" rx="5" fill="#141d24" stroke="#71858f"/><text x="1228" y="113" text-anchor="middle" font-size="14">Editing locked / Unlock</text>
<path d="M1378 108h12M1426 102h12v12h-12zM1475 102l12 12m0-12-12 12" fill="none" stroke="#a6b5b8"/>
<text x="106" y="178" class="label muted">CURRENT SONG / 3 OF 12</text><text x="106" y="216" font-size="30" font-weight="600">Night crossing</text>
<text x="106" y="250" font-size="16" class="muted">Verse 2 / 6/8 / 2 main pulses per bar</text>
<ellipse cx="640" cy="361" rx="330" ry="173" fill="url(#ambient)"/>
<text x="627" y="403" text-anchor="middle" font-size="167" class="number">80<tspan font-size="56" class="muted">.0</tspan></text>
<text x="627" y="449" text-anchor="middle" font-size="24" class="cyan">BPM / dotted quarter</text>
<path d="M495 484h264" stroke="#33444c"/><path d="m551 470 14 14-14 14-14-14z" fill="#f3e687"/><rect x="695" y="475" width="18" height="18" fill="#71858f"/>
<text x="551" y="525" text-anchor="middle" font-size="20" class="gold">1</text><text x="704" y="525" text-anchor="middle" font-size="20" class="muted">2</text>
<path d="M1000 168v356" stroke="#33444c"/>
<text x="1040" y="184" class="label muted">UP NEXT</text><text x="1040" y="227" font-size="27">Bridge / 8 bars</text><text x="1040" y="261" font-size="17" class="muted">Same tempo / 6/8</text>
<path d="M1040 294h450" stroke="#33444c"/><text x="1040" y="329" class="label muted">NEXT SONG ARMED</text><text x="1040" y="367" font-size="24">City after midnight</text><text x="1040" y="400" font-size="15" class="muted">Quarter = 104 / 4/4 / 1 bar count-in</text>
<rect x="1040" y="433" width="450" height="53" rx="9" fill="#252b26" stroke="#f3e687"/><text x="1265" y="467" text-anchor="middle" font-size="18" class="gold">Next + count-in</text>
<text x="1040" y="518" font-size="13" class="muted">Manual transition / footswitch ready</text>
<path d="M94 548h1412" stroke="#33444c"/>
<rect x="106" y="566" width="142" height="45" rx="8" fill="#58e4f4"/><text x="177" y="595" text-anchor="middle" font-size="17" style="fill:#09291f;font-weight:600">Pause</text>
<rect x="262" y="566" width="108" height="45" rx="8" fill="#141d24" stroke="#71858f"/><text x="316" y="595" text-anchor="middle" font-size="16">Stop</text>
<rect x="384" y="566" width="142" height="45" rx="8" fill="#141d24" stroke="#71858f"/><text x="455" y="595" text-anchor="middle" font-size="17">Mute click</text>
<text x="570" y="594" font-size="14" class="cyan">Playing / 02:36</text><text x="1050" y="594" font-size="14">Headphones / USB</text><text x="1360" y="594" font-size="14" class="cyan">Internal clock</text>
