<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" style="width:100%;height:auto;max-width:1600px;display:block" role="img" aria-labelledby="title desc">
<title id="title">Resonant Pulse - Play design concept</title>
<desc id="desc">Static dark native Windows metronome concept. A cyan phase dial surrounds a 120 BPM readout, with magenta subdivisions, four labelled beats, simple musical controls and a fixed transport. A compact player and design notes appear beneath the main screen. This is design artwork, not a functioning app.</desc>
